# CI 格式检查要求：
# 1. 每个字段上方必须有注释。
# 2. 字段之间必须留空行。
# 3. 不允许行内注释（字段同一行）。
# 4. 嵌套字段需保持正确缩进层级。

# 默认组件配置（Hydra defaults）
defaults:

  # Hydra 映射格式：<folder>@<field>.<field>: <yaml_file>
  # 示例：actor_rollout_ref.actor 对应 trainer/config/actor/dp_actor.yaml
  - actor@actor_rollout_ref.actor: dp_actor

  # 数据配置（legacy_data）
  - data@data: legacy_data

  # 规则奖励管理器配置
  - reward_manager@reward_manager

  # Reference 模型配置（当 actor.use_kl_loss 或 algorithm.use_kl_in_reward 为 True 时启用）
  - ref@actor_rollout_ref.ref: dp_ref

  # Rollout 推理配置
  - rollout@actor_rollout_ref.rollout: rollout

  # 模型配置（HF 模型）
  - model@actor_rollout_ref.model: hf_model

  # Critic 模型配置
  - critic@critic: dp_critic

  # Reward model 配置
  - reward_model@reward_model: dp_reward_loop

  # Rollout 修正配置
  - algorithm@algorithm.rollout_correction: rollout_correction

  # 加载默认配置后，再用当前文件覆盖
  - _self_

# Actor / Rollout / Reference 的组合配置
actor_rollout_ref:

  # 是否启用 Hybrid Engine（目前仅支持 Hybrid）
  hybrid_engine: true

  # 分布式进程组操作超时（秒）
  nccl_timeout: 600

  # Rollout 相关子配置
  rollout:

    # 超大模型可用 layered_summon 节省显存（但会变慢）
    layered_summon: False

# 自定义奖励函数配置
custom_reward_function:

  # 自定义奖励函数文件路径（不填则使用内置规则奖励）
  path: null

  # 自定义函数名（默认 compute_score）
  name: compute_score

# 算法配置
algorithm:

  # 用于 dataclass 实例化的目标类
  _target_: verl.trainer.config.AlgoConfig

  # 折扣因子（gamma）
  gamma: 1.0

  # GAE 的偏差-方差权衡（lambda）
  lam: 1.0

  # 优势估计器类型：gae / grpo / reinforce_plus_plus 等
  adv_estimator: gae

  # GRPO 是否按标准差归一化优势
  norm_adv_by_std_in_grpo: True

  # 是否在 reward 中加入 KL 惩罚
  use_kl_in_reward: False

  # KL 估计方式：kl / abs / mse / low_var_kl / full
  kl_penalty: kl

  # KL 控制器配置
  kl_ctrl:

    # 用于 dataclass 实例化的目标类
    _target_: verl.trainer.config.KLControlConfig

    # KL 控制类型：fixed / adaptive
    type: fixed

    # KL 惩罚初始系数
    kl_coef: 0.001

    # 自适应控制器的 horizon（步数）
    horizon: 10000

    # 目标 KL（自适应控制器使用）
    target_kl: 0.1

  # 是否启用偏好反馈 PPO
  use_pf_ppo: False

  # 偏好反馈 PPO 细节配置
  pf_ppo:

    # 样本重加权方法：pow / max_min / max_random
    reweight_method: pow

    # pow 方法的指数
    weight_pow: 2.0

# 训练器配置
trainer:

  # 是否在分布式 worker 间平衡 batch 大小
  balance_batch: True

  # 训练 epoch 数
  total_epochs: 30

  # 总训练步数（可显式设置或由 epoch 推导）
  total_training_steps: null

  # 实验追踪项目名（如 wandb）
  project_name: verl_examples

  # 实验名称（用于区分 run）
  experiment_name: gsm8k

  # 日志后端：console / wandb 等
  logger: ["console", "wandb"]

  # 验证时记录的生成样本数量
  log_val_generations: 0

  # rollout 数据落盘目录（null 表示不落盘）
  rollout_data_dir: null

  # 验证数据落盘目录（null 表示不落盘）
  validation_data_dir: null

  # 训练节点数
  nnodes: 1

  # 每节点 GPU 数
  n_gpus_per_node: 8

  # checkpoint 保存频率（按 iteration，-1 表示不保存）
  save_freq: -1

  # ESI 预留时间（用于弹性算力提前保存 checkpoint）
  # 计算逻辑：最长历史 step 时长 + 保存耗时 + esi_redundant_time
  esi_redundant_time: 0

  # 续训模式：auto / disable / resume_path
  # auto：若有最新 ckpt 则自动恢复
  # disable：从头训练
  # resume_path：从指定路径恢复
  resume_mode: auto

  # 续训路径（resume_mode=resume_path 时生效）
  resume_from_path: null

  # 是否在训练前先跑一次验证
  val_before_train: True

  # 是否仅做验证不训练
  val_only: False

  # 验证频率（按 iteration，-1 表示不验证）
  test_freq: -1

  # critic 预热步数（PPO 使用）
  critic_warmup: 0

  # 分布式文件系统默认保存路径
  default_hdfs_dir: null

  # 加载后是否删除本地 checkpoint
  del_local_ckpt_after_load: False

  # 本地默认保存目录
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}

  # 最多保留的 actor ckpt 数
  max_actor_ckpt_to_keep: null

  # 最多保留的 critic ckpt 数
  max_critic_ckpt_to_keep: null

  # Ray worker 注册等待超时（秒）
  ray_wait_register_center_timeout: 300

  # 训练设备（如 cuda / cpu / npu）
  device: cuda

  # 是否使用旧版 worker 实现
  # 模式：auto / enable / disable
  use_legacy_worker_impl: auto

# 全局 profiler 配置
global_profiler:

  # 用于 dataclass 实例化的目标类
  _target_: verl.utils.profiler.ProfilerConfig

  # Profiling 工具：nsys / npu / torch / torch_memory
  tool: null

  # 采样/剖析的 step 列表
  steps: null

  # 是否将连续 step 合并到同一数据库
  # True：连续 step 合并；False：每个 step 单独记录
  profile_continuous_steps: False

  # Profiling 结果保存路径
  save_path: "outputs/profile"

  # 具体工具配置（可用 +profiler.tool_config.[tool].xxx 覆盖）
  global_tool_config:

    # nsys 配置
    nsys:

      # 用于 dataclass 实例化的目标类
      _target_: verl.utils.profiler.config.NsightToolConfig

      # True：每个 task 单独数据库；False：同一步共享数据库
      discrete: False

      # controller 侧 Nsight Systems 选项（profile_steps 不为空时必填）
      # 参考：Nsight Systems / Ray profiling 文档
      controller_nsight_options:

        # 追踪的 API 列表
        trace: "cuda,nvtx,cublas,ucx"

        # 记录 CUDA kernel 的显存使用（字符串 "true"/"false"）
        cuda-memory-usage: "true"

        # CUDA graph 作为整体追踪
        cuda-graph-trace: "graph"

      # worker 侧 Nsight Systems 选项（profile_steps 不为空时必填）
      worker_nsight_options:

        # 追踪的 API 列表
        trace: "cuda,nvtx,cublas,ucx"

        # 记录 CUDA kernel 的显存使用（字符串 "true"/"false"）
        cuda-memory-usage: "true"

        # CUDA graph 作为整体追踪
        cuda-graph-trace: "graph"

        # 仅在 torch.cuda.profiler.start/stop 区间内采样（不建议修改）
        capture-range: "cudaProfilerApi"

        # capture-range 结束后的行为（repeat-shutdown:n 或 null）
        # whole step：n = len(profile_steps)
        # 离散 profiling：n = len(profile_steps) * 子任务数
        capture-range-end: null

        # 结束时是否向进程组发送信号（none 表示不发送）
        kill: none

    # torch_memory：用于显存可视化调试
    torch_memory:

      # 记录的最大分配条目数
      trace_alloc_max_entries: 100_000

      # 每次分配记录的调用栈深度
      stack_depth: 32

      # 记录上下文：alloc / state / all
      context: "all"

      # 记录栈类型：python / cpp / all
      stacks: "all"

      # 其他扩展参数（devices/record_context 等）
      kw_args: {}

# TransferQueue 配置
transfer_queue:

  # 是否启用 transfer queue
  enable: False

# Ray 相关配置
ray_kwargs:

  # Ray 初始化配置
  ray_init:

    # Ray 可用 CPU 数（SLURM 环境建议显式指定）
    num_cpus: null

  # Ray timeline JSON 保存路径（性能分析）
  timeline_json_file: null
